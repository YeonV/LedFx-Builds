name: Android variant without Now Playing

# Derives a second APK from an already published release: the same build with
# the notification-listener service (PythonNotificationListenerService) removed
# from the manifest, re-signed with the production keystore. Same package and
# key, so the two variants install over each other and keep the app's data.
#
# Purpose: Play Protect hard-blocks some sideloaded installs with "this app can
# request access to sensitive data". Whether the notification listener is the
# trigger is not established; installing this variant through a file manager
# is the test. Nothing else triggers this workflow.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to derive from (for example v2.2.0-b5)'
        required: true
      arch:
        description: 'Architecture, or all'
        default: 'arm64-v8a'
        required: true
        type: choice
        options:
          - 'arm64-v8a'
          - 'armeabi-v7a'
          - 'x86_64'
          - 'all'
      upload:
        description: 'Upload the variant to the release'
        default: 'Yes'
        required: true
        type: choice
        options:
          - 'Yes'
          - 'No'

jobs:
  strip_listener:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.inputs.tag }}
      ARCH: ${{ github.event.inputs.arch }}
      APKTOOL_VERSION: '2.9.3'
    steps:
      - name: Download release APKs
        run: |
          mkdir -p in
          if [ "$ARCH" = "all" ]; then pattern='*--android-*-release.apk'; else pattern="*--android-${ARCH}-release.apk"; fi
          gh release download "$TAG" -R "${{ github.repository }}" -p "$pattern" -D in
          ls -l in
          if ! ls in/*.apk >/dev/null 2>&1; then
            echo "::error::No APK matching $pattern in release $TAG"
            exit 1
          fi

      - name: Install apktool
        run: |
          curl -fsSL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          java -jar apktool.jar --version

      - name: Decode keystore from secrets
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_LEDFX_BASE64 }}" | base64 -d > $RUNNER_TEMP/ledfx-keystore.jks

      - name: Strip the listener and re-sign
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BT"
          mkdir -p out work
          for apk in in/*.apk; do
            name=$(basename "$apk" .apk)
            echo "::group::$name"
            # -s keeps classes.dex untouched; only the manifest is edited.
            java -jar apktool.jar d -s -f -o "work/$name" "$apk"
            python3 - "work/$name/AndroidManifest.xml" <<'PY'
          import re, sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          pattern = re.compile(
              r'\s*<service[^>]*android:name="org\.kivy\.android\.PythonNotificationListenerService"[^>]*>.*?</service>',
              re.S,
          )
          text, count = pattern.subn("", text)
          if count != 1:
              sys.exit(f"expected exactly one listener service, removed {count}")
          if "PythonNotificationListenerService" in text:
              sys.exit("listener still referenced in the manifest")
          open(path, "w", encoding="utf-8").write(text)
          print("removed the notification listener service")
          PY
            java -jar apktool.jar b -o "work/$name-unaligned.apk" "work/$name"
            "$BT/zipalign" -p -f 4 "work/$name-unaligned.apk" "work/$name-aligned.apk"
            "$BT/apksigner" sign --ks $RUNNER_TEMP/ledfx-keystore.jks \
              --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_LEDFX_PASSWORD }} \
              --key-pass pass:${{ secrets.ANDROID_KEYSTORE_LEDFX_PASSWORD }} \
              --ks-key-alias ${{ secrets.ANDROID_KEYSTORE_LEDFX_ALIAS }} \
              --out "out/$name-no-nowplaying.apk" \
              "work/$name-aligned.apk"
            "$BT/apksigner" verify "out/$name-no-nowplaying.apk"

            # The variant must differ from the original only by the listener.
            "$BT/aapt2" dump badging "$apk" | grep -E "^package:" > work/orig.txt
            "$BT/aapt2" dump badging "out/$name-no-nowplaying.apk" | grep -E "^package:" > work/new.txt
            diff work/orig.txt work/new.txt
            if "$BT/aapt2" dump xmltree --file AndroidManifest.xml "out/$name-no-nowplaying.apk" | grep -q PythonNotificationListenerService; then
              echo "::error::listener still present in out/$name-no-nowplaying.apk"
              exit 1
            fi
            orig_cert=$("$BT/apksigner" verify --print-certs "$apk" | grep "SHA-256")
            new_cert=$("$BT/apksigner" verify --print-certs "out/$name-no-nowplaying.apk" | grep "SHA-256")
            [ "$orig_cert" = "$new_cert" ] || { echo "::error::signing certificate differs"; exit 1; }
            echo "same package, version and certificate; listener removed"
            echo "::endgroup::"
          done
          ls -l out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: no-nowplaying-${{ github.event.inputs.tag }}-${{ github.event.inputs.arch }}
          path: out/*.apk

      - name: Upload to release
        if: ${{ github.event.inputs.upload == 'Yes' }}
        run: gh release upload "$TAG" out/*.apk -R "${{ github.repository }}" --clobber
